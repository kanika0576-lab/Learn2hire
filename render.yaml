# Learn2Hire — Render blueprint (Infrastructure as Code)
#
# Apply in Render: Dashboard → "Blueprint" → connect this repo, or
# `render blueprint apply` via the Render CLI.
#
# Updates the existing web service named "Learn2hire" (no duplicate created).
# Backend runs from ./backend/Dockerfile (includes ffmpeg for mkv/webm/avif
# → MP4 conversion). A persistent 1 GB disk is mounted at /data so the
# SQLite database (registrations, chats, quiz results, courses) survives
# redeploys and restarts.
#
# Notes:
#  - JWT_SECRET and GEMINI_API_KEY are intentionally omitted so the existing
#    values on the "Learn2hire" service are preserved (not regenerated).
#  - DATABASE_URL uses the absolute /data path so SQLite lives on the disk.
#  - Auto Deploy is enabled from main.

services:
  - type: web
    name: Learn2hire
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////data/learn2hire.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
    disk:
      name: learn2hire-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /api/health
    autoDeploy: true
